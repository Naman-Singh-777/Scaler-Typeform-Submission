# Render blueprint for the API. (Frontend: import /frontend into Vercel and set NEXT_PUBLIC_API_URL.)
services:
  - type: web
    name: typeform-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: "*"   # tighten to your Vercel URL after deploying
